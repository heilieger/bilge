<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Menüsü</title>
    <style>
        body { background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* Kare Kutu */
        .square-box {
            background-color: white;
            width: 88vh; height: 88vh;
            border: 15px solid #e30613;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        /* Ultra Şeffaf Arka Plan Logosu (Filigran) */
        .square-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('i.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 75%;
            opacity: 0.07; /* %7 Şeffaflık - İstediğin gibi çok silik */
            z-index: 1;
        }

        /* İçerik Katmanı - Logonun Üstünde Kalması İçin */
        .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }
        
        h2 { font-size: 3.5rem; color: #e30613; margin: 15px 0 5px 0; font-weight: 900; }
        #tarih { font-size: 1.6rem; color: #444; font-weight: bold; }
        .divider { border-top: 3px solid #eee; margin: 15px 0; }

        #menu-text {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.4rem; 
            font-weight: bold;
            color: #000;
            line-height: 1.4;
        }

        .footer { font-size: 2rem; color: #e30613; font-weight: bold; letter-spacing: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="square-box">
        <div class="content">
            <h2>YEMEK MENÜSÜ</h2>
            <div id="tarih">--.--.----</div>
            <div class="divider"></div>
            
            <div id="menu-text">Yükleniyor...</div>
            
            <div class="divider"></div>
            <div class="footer">AFİYET OLSUN</div>
        </div>
    </div>

    <script>
        // Pi Zero 2W için en ilkel ve en sağlam JS mantığı
        var veriler = {
            "30.01.2026": "1.KURU KÖFTE PATATES<br>2.ERİŞTE<br>3.TARHANA ÇORBASI<br>4.SALATA",
            "29.01.2026": "1.ETLİ MEVSİM TÜRLÜSÜ<br>2.MAKARNA (SOSLU)<br>3.MERCİMEK ÇORBASI<br>4.TATLI"
        };

        function baslat() {
            var simdi = new Date();
            var g = simdi.getDate();
            var a = simdi.getMonth() + 1;
            var y = simdi.getFullYear();

            // Tarih formatlama
            if (g < 10) g = "0" + g;
            if (a < 10) a = "0" + a;
            var bugun = g + "." + a + "." + y;
            
            // Veriyi Basma
            document.getElementById('tarih').innerHTML = bugun;
            var alan = document.getElementById('menu-text');
            
            if (veriler[bugun]) {
                alan.innerHTML = veriler[bugun];
            } else {
                alan.innerHTML = bugun + "<br>Menü Bulunamadı.";
            }
        }
        
        // Tarayıcıya "işini bitirince bunu yap" diyoruz
        window.onload = baslat;
    </script>
</body>
</html>
