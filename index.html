<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Kare Menü</title>
    <style>
        body {
            background: #2c2c2c;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Kare Kutu Ayarı */
        .square-box {
            background: white;
            width: 80vh; /* Ekran yüksekliğine göre kare genişliği */
            height: 80vh; /* Tam kare olması için genişlikle aynı */
            border: 20px solid #e30613; /* Okul Kırmızısı */
            border-radius: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        .header { border-bottom: 2px solid #ddd; padding-bottom: 15px; }
        h1 { font-size: 2rem; color: #444; margin: 0; }
        h2 { font-size: 3rem; color: #e30613; margin: 10px 0; font-weight: 900; }
        .date { font-size: 1.5rem; color: #888; margin-bottom: 10px; }

        .menu-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.8rem; /* Kare içine sığması için optimize edildi */
            font-weight: bold;
            color: #222;
            line-height: 1.2;
        }

        .footer { 
            font-size: 1.8rem; 
            color: #e30613; 
            font-weight: bold; 
            padding-top: 15px; 
            border-top: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="square-box">
        <div class="header">
            <h2>YEMEK MENÜSÜ</h2>
            <div id="tarih-label" class="date">--.--.----</div>
        </div>
        
        <div id="menu-area" class="menu-content">
            Yükleniyor...
        </div>

        <div class="footer">AFİYET OLSUN</div>
    </div>
