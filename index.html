<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Menü</title>
    <style>
        body { background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; text-align: center; }
        .box { background: white; border: 12px solid #e30613; border-radius: 35px; padding: 25px; width: 85vh; height: 85vh; display: flex; flex-direction: column; box-sizing: border-box; }
        h1 { font-size: 1.5rem; color: #444; margin: 0; }
        h2 { font-size: 2.5rem; color: #e30613; margin: 5px 0; }
        #date-box { font-size: 1.3rem; color: #888; }
        /* Yemek Alanı - Yazılar Küçültüldü */
        #menu-box { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; font-size: 2.2rem; font-weight: bold; color: #222; line-height: 1.2; border-top: 2px solid #eee; border-bottom: 2px solid #eee; margin: 10px 0; }
        .icon { fill: #e30613; margin: 5px 0; }
        .footer { font-size: 1.5rem; color: #e30613; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>YEMEK MENÜSÜ</h2>
        <div id="date-box">Tarih Bekleniyor...</div>
        <div id="menu-box">Menü Bekleniyor...</div>
        <div class="icon">
            <svg width="45" height="45" viewBox="0 0 512 512"><path d="M416 0C363 0 320 43 320 96v128h-32V96c0-17.7-14.3-32-32-32s-32 14.3-32 32v128h-32V96c0-53-43-96-96-96S0 43 0 96v224c0 35.3 28.7 64 64 64h64v96c0 17.7 14.3 32 32 32s32-14.3 32-32v-96h64c35.3 0 64-28.7 64-64V96c0-53-43-96-96-96zM96 320H64V96c0-17.7 14.3-32 32-32s32 14.3 32 32v224c0 17.7-14.3 32-32 32zm320 128h-32V256h32v192zm0-256V96c0-17.7 14.3-32 32-32s32 14.3 32 32v352c0 17.7-14.3 32-32 32s-32-14.3-32-32V192z"/></svg>
        </div>
        <div class="footer">AFİYET OLSUN</div>
    </div>

    <script>
        // PDF'deki Menü Verileri 
        const data = {
            "30.01.2026": "1.KURU KÖFTE PATATES<br>2.ERİŞTE<br>3.TARHANA ÇORBASI<br>4.SALATA",
            "29.01.2026": "1.ETLİ MEVSİM TÜRLÜSÜ<br>2.MAKARNA (SOSLU)<br>3.MERCİMEK ÇORBASI<br>4.TATLI"
        };

        function update() {
            try {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const today = d + "." + m + "." + y;

                document.getElementById('date-box').innerText = today;
                
                const menu = data[today];
                if (menu) {
                    document.getElementById('menu-box').innerHTML = menu;
                } else {
                    document.getElementById('menu-box').innerHTML = "Bugün için kayıtlı<br>menü bulunamadı.";
                }
            } catch (err) {
                document.getElementById('menu-box').innerHTML = "Hata: " + err.message;
            }
        }
        // Sayfa yüklendiğinde çalıştır
        update();
    </script>
</body>
</html>
