<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif; 
        }
        /* Tam Kare Kutu Tasarımı */
        .square-box {
            background: white;
            width: 90vh; /* Ekranın yüksekliğine göre kare genişliği */
            height: 90vh; /* Genişlikle aynı yaparak kare sağlıyoruz */
            border: 20px solid #e30613; /* Kurumsal Kırmızı */
            border-radius: 50px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .header h1 { font-size: 2rem; color: #444; margin: 0; }
        .header h2 { font-size: 3.5rem; color: #e30613; margin: 5px 0; font-weight: 900; }
        #date-label { font-size: 1.8rem; color: #888; margin-bottom: 5px; }
        .divider { border-top: 3px solid #eee; margin: 15px 0; }
        /* Yemeklerin Olduğu Orta Alan */
        .menu-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 3rem; /* TV'den okunması için büyük font */
            font-weight: bold;
            color: #222;
            line-height: 1.3;
        }
        .footer { font-size: 2rem; color: #e30613; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        .icon-box { fill: #e30613; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="square-box">
        <div class="header">
            <h1>BİLGE KOLEJİ</h1>
            <h2>YEMEK MENÜSÜ</h2>
            <div id="date-label">--.--.----</div>
        </div>
        <div class="divider"></div>
        <div id="menu-area" class="menu-content">Yükleniyor...</div>
        <div class="divider"></div>
