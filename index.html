<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Menüsü (4:3)</title>
    <style>
        body { background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* 4:3 Oranlı Kutu Ayarı */
        .box-4-3 {
            background-color: white;
            width: 96vh; /* Yüksekliğin 1.33 katı (4:3 Landscape) */
            height: 72vh;
            border: 15px solid #e30613;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        /* Arka Plan Filigranı (Ultra Şeffaf) */
        .box-4-3::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('i.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60%; /* Oran 4:3 olduğu için logoyu biraz küçülttük */
            opacity: 0.08; 
            z-index: 1;
        }

        .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }

        #tarih { font-size: 1.5rem; color: #444; font-weight: bold; }
        .divider { border-top: 3px solid #eee; margin: 12px 0; }
