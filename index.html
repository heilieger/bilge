<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        /* Tam Kare Kutu */
        .square-box {
            background: white;
            width: 86vh; 
            height: 86vh; 
            border: 15px solid #e30613; 
            border-radius: 45px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            position: relative; /* Arka plan logosu için */
            overflow: hidden;
        }

        /* Arka Plan Logosu (Watermark) */
        .background-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; /* Logonun büyüklüğü */
            opacity: 0.25; /* "Oposity yüksek" isteğine göre ayarlandı */
            z-index: 1;
            pointer-events: none;
        }

        /* İçerik Katmanı */
        .content-layer {
            position: relative;
            z-index: 2; /* Yazıları logonun önüne çıkartır */
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header h2 { 
            font-size: 3.5rem; 
            color: #e30613; 
            margin: 10px 0 5px 0; 
            font-weight: 900; 
            text-transform: uppercase;
        }
        
        #date-box { 
            font-size: 1.6rem; 
            color: #888; 
            font-weight: bold;
        }
        
        .divider { 
            border-top: 2px solid #eee; 
            margin: 15px 0; 
        }

        #menu-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.4rem; 
            font-weight: bold;
            color: #111;
            line-height: 1.4;
        }

        .footer { 
            font-size: 1.8rem; 
            color: #e30613; 
            font-weight: bold; 
            letter-spacing: 4px;
            margin-top: 10px;
        }
    </style>
</head>
