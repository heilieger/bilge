<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        .square-box {
            background: white;
            width: 86vh; 
            height: 86vh; 
            border: 15px solid #e30613; 
            border-radius: 45px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            position: relative; /* Arka plan logosu için */
            overflow: hidden;
        }

        /* Arka Plan Logosu (Filigran) */
        .background-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; /* Logonun ekrandaki büyüklüğü */
            opacity: 0.12; /* Şeffaflık (0.1-0.2 arası idealdir) */
            z-index: 1;
            pointer-events: none; /* Yazıların seçilmesini engellemez */
        }

        .content-layer {
            position: relative;
            z-index: 2; /* Yazıları logonun önüne çıkartır */
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header h2 { 
            font-size: 3.2rem; 
            color: #e30613; 
            margin: 10px 0 5px 0; 
            font-weight: 900; 
            text-transform: uppercase;
        }
        
        #date-box { 
            font-size: 1.5rem; 
            color: #888; 
            font-weight: bold;
        }
        
        .divider { 
            border-top: 2px solid #eee; 
            margin: 15px 0; 
        }

        #menu-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.3rem; 
            font-weight: bold;
            color: #111;
            line-height: 1.4;
        }

        .footer { 
            font-size: 1.8rem; 
            color: #e30613; 
            font-weight: bold; 
            letter-spacing: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="square-box">
        <img src="i.png" class="background-watermark" alt="Filigran">

        <div class="content-layer">
            <div class="header">
                <h2>YEMEK MENÜSÜ</h2>
                <div id="date-box">--.--.----</div>
            </div>
            
            <div class="divider"></div>
            
            <div id="menu-box">Menü Yükleniyor...</div>
            
            <div class="divider"></div>
            
            <div class="footer">AFİYET OLSUN</div>
        </div>
    </div>
