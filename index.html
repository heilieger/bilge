<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        .square-box {
            background: white;
            width: 86vh; 
            height: 86vh; 
            border: 15px solid #e30613; 
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            position: relative; /* Arka plan logosu için gerekli */
            overflow: hidden;
        }

        /* Arka Plan Logosu (Watermark) */
        .background-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; /* Logonun büyüklüğü */
            opacity: 0.15; /* Şeffaflık: 0.1 çok silik, 0.3 daha belirgin yapar */
            z-index: 1; /* Yazıların arkasında kalması için */
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 2; /* Yazıları logonun önüne çıkarır */
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header h1 { font-size: 1.4rem; color: #444; margin: 0; }
        .header h2 { font-size: 2.3rem; color: #e30613; margin: 5px 0; font-weight: 900; }
        #date-box { font-size: 1.2rem; color: #888; }
        
        .divider { border-top: 2px solid #eee; margin: 10px 0; }

        #menu-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.1rem;
            font-weight: bold;
            color: #111;
            line-height: 1.3;
        }

        .footer { 
            font-size: 1.6rem; 
            color: #e30613; 
            font-weight: bold; 
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="square-box">
        <img src="i.png" class="background-logo" alt="Arka Plan Logo">

        <div class="content-layer">
            <div class="header">
                <h1>BİLGE KOLEJİ</h1>
                <h2>YEMEK MENÜSÜ</h2>
                <div id="date-box">--.--.----</div>
            </div>
            
            <div class="divider"></div>
            
            <div id="menu-box">Menü Yükleniyor...</div>
            
            <div class="divider"></div>
            
            <div class="footer">AFİYET OLSUN</div>
        </div>
    </div>

    <script>
        const liste = {
            "30.01.2026": "1.KURU KÖFTE PATATES<br>2.ERİŞTE<br>3.TARHANA ÇORBASI<br>4.SALATA",
            "29.01.2026": "1.ETLİ MEVSİM TÜRLÜSÜ<br>2.MAKARNA (SOSLU)<br>3.MERCİMEK ÇORBASI<br>4.TATLI"
        };

        function start() {
            try {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const today = d + "." + m + "." + y;

                document.getElementById('date-box').innerText = today;
                const alan = document.getElementById('menu-box');

                if (liste[today]) {
                    alan.innerHTML = liste[today];
                } else {
                    alan.innerHTML = today + " için<br>menü girilmemiştir.";
                }
            } catch (err) { console.error(err); }
        }
        start();
