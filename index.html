<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Yemek Menüsü</title>
    <style>
        /* Tasarım Ayarları */
        body { background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .card { background: white; border: 15px solid #ff0000; border-radius: 40px; padding: 40px; text-align: center; width: 85%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #444; margin: 0; }
        h2 { font-size: 4rem; color: #ff0000; margin: 10px 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tarih-etiket { font-size: 1.8rem; color: #777; margin-bottom: 20px; }
        .menu-liste { font-size: 3.2rem; line-height: 1.3; font-weight: bold; color: #222; min-height: 200px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>BİLGE KOLEJİ</h1>
        <h2>GÜNÜN MENÜSÜ</h2>
        <div id="tarih-alanı" class="tarih-etiket">Tarih Belirleniyor...</div>
        <div id="menu-alanı" class="menu-liste">Menü Bekleniyor...</div>
    </div>

    <script>
        // PDF'teki Veriler (30.01.2026 dahil)
        const menuVerileri = {
            "05.01.2026": "Sebzeli Fırın Baget<br>Bulgur Pilavı<br>Cacık<br>Meyve",
            "12.01.2026": "Sebzeli Şakşuka<br>Makarna<br>Mercimek Çorbası<br>Yoğurt",
            "19.01.2026": "Etli Ev Mantısı<br>Mercimek Çorbası<br>Yoğurt<br>Çiğ Köfte",
            "26.01.2026": "Sebze Kızartma<br>Makarna<br>Ezogelin<br>Yoğurt",
            "27.01.2026": "Etli Nohut<br>Pirinç Pilavı<br>Düğün Çorbası<br>Turşu",
            "28.01.2026": "Fırın Piliç Pirzola<br>Bulgur Pilavı<br>Domates Çorbası<br>Cacık",
            "29.01.2026": "Etli Mevsim Türlüsü<br>Soslu Makarna<br>Mercimek Çorbası<br>Tatlı",
            "30.01.2026": "Kuru Köfte Patates<br>Erişte<br>Tarhana Çorbası<br>Salata"
        };

        function guncelle() {
            try {
                const simdi = new Date();
                const gun = String(simdi.getDate()).padStart(2, '0');
                const ay = String(simdi.getMonth() + 1).padStart(2, '0');
                const yil = simdi.getFullYear();
                const bugun = `${gun}.${ay}.${yil}`;

                document.getElementById('tarih-alanı').innerText = bugun;
                
                const menu = menuVerileri[bugun];
                if (menu) {
                    document.getElementById('menu-alanı').innerHTML = menu;
                } else {
                    document.getElementById('menu-alanı').innerHTML = "Bugün için menü<br>tanımlanmamış.";
                }
            } catch (hata) {
                document.getElementById('menu-alanı').innerText = "Hata oluştu: " + hata;
            }
        }

        // DOM hazır olduğunda çalıştır
        window.onload = guncelle;
    </script>
</body>
</html>
