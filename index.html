<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Menü</title>
    <style>
        body { background: #222; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; text-align: center; }
        .box { background: white; color: black; border: 15px solid #ff0000; border-radius: 40px; padding: 30px; width: 85%; }
        h1 { font-size: 2.5rem; margin: 0; color: #444; }
        h2 { font-size: 4rem; color: #ff0000; margin: 10px 0; }
        #tarih { font-size: 1.5rem; color: #888; margin-bottom: 20px; }
        #menu { font-size: 3rem; font-weight: bold; line-height: 1.2; }
        .debug { font-size: 0.8rem; color: #aaa; position: absolute; bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>BİLGE KOLEJİ</h1>
        <h2>GÜNÜN MENÜSÜ</h2>
        <div id="tarih">Tarih Okunuyor...</div>
        <div id="menu">Menü Yükleniyor...</div>
    </div>
    <div id="debug-info" class="debug">JS Bekleniyor...</div>

    <script>
        // PDF'TEN ÇIKARILAN MENÜ VERİSİ
        const menuData = {
            "30.01.2026": "Kuru Köfte Patates<br>Erişte<br>Tarhana Çorbası<br>Salata",
            "29.01.2026": "Etli Mevsim Türlüsü<br>Soslu Makarna<br>Mercimek Çorbası<br>Tatlı",
            "28.01.2026": "Fırın Piliç Pirzola<br>Bulgur Pilavı<br>Domates Çorbası<br>Cacık"
        };

        try {
            document.getElementById('debug-info').innerText = "JS Başladı...";
            
            const d = new Date();
            const gun = String(d.getDate()).padStart(2, '0');
            const ay = String(d.getMonth() + 1).padStart(2, '0');
            const yil = d.getFullYear();
            const bugun = gun + "." + ay + "." + yil;

            document.getElementById('tarih').innerText = bugun;
            document.getElementById('debug-info').innerText = "Bugün: " + bugun;

            const yemek = menuData[bugun];
            if (yemek) {
                document.getElementById('menu').innerHTML = yemek;
            } else {
                document.getElementById('menu').innerHTML = "Bu tarih için<br>kayıt bulunamadı.";
            }
        } catch (err) {
            document.getElementById('menu').innerText = "Hata: " + err.message;
        }
    </script>
</body>
</html>
