<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        /* Tam Kare Kutu */
        .square-box {
            background: white;
            width: 86vh; 
            height: 86vh; 
            border: 15px solid #e30613; 
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .header h1 { font-size: 1.4rem; color: #444; margin: 0; }
        .header h2 { font-size: 2.3rem; color: #e30613; margin: 5px 0; font-weight: 900; }
        #date-box { font-size: 1.2rem; color: #888; }
        
        .divider { border-top: 2px solid #eee; margin: 8px 0; }

        /* Menü İçeriği - Taşmayı Önleyen Font Boyutu */
        #menu-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2rem; /* Uzun yemek isimleri için optimize edildi */
            font-weight: bold;
            color: #222;
            line-height: 1.2;
            padding: 0 10px;
        }

        /* i.png Logo Alanı */
        .logo-area { 
            height: 110px; 
            margin: 5px 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .logo-area img {
            max-height: 100%;
            max-width: 90%;
            object-fit: contain;
        }
        
        .footer { 
            font-size: 1.6rem; 
            color: #e30613; 
            font-weight: bold; 
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="square-box">
        <div class="header">
            <h1>BİLGE KOLEJİ</h1>
            <h2>YEMEK MENÜSÜ</h2>
            <div id="date-box">Tarih Bekleniyor...</div>
        </div>
        
        <div class="divider"></div>
