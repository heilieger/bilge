<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilge Koleji Yemek Menüsü</title>
    <style>
        body { 
            background: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        .square-box {
            background: white;
            width: 88vh; /* Ekran yüksekliğine göre kare genişliği */
            height: 88vh; 
            border: 15px solid #e30613; 
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .header h1 { font-size: 1.6rem; color: #444; margin: 0; letter-spacing: 1px; }
        .header h2 { font-size: 2.8rem; color: #e30613; margin: 5px 0; font-weight: 900; }
        #date-label { font-size: 1.4rem; color: #888; margin-bottom: 5px; }
        
        .divider { border-top: 2px solid #eee; margin: 10px 0; }

        /* Yemek Alanı - Boyut Küçültüldü */
        .menu-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.4rem; /* Taşmayı önleyen ideal boyut */
            font-weight: bold;
            color: #222;
            line-height: 1.25;
            padding: 0 10px;
        }

        .icon-box { fill: #e30613; margin: 10px 0; }
        
        .footer { 
            font-size: 1.6rem; 
            color: #e30613; 
            font-weight: bold; 
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="square-box">
        <div class="header">
            <h1>BİLGE KOLEJİ</h1>
            <h2>YEMEK MENÜSÜ</h2>
            <div id="date-label">--.--.----</div>
        </div>
        
        <div class="divider"></div>
        
        <div id="menu-area" class="menu-content">
            Yükleniyor...
        </div>
        
        <div class="divider"></div>

        <div class="icon-box">
            <svg width="50" height="50" viewBox="0 0 512 512">
                <path d="M416 0C363 0 320 43 320 96v128h-32V96c0-17.7-14.3-32-32-32s-32 14.3-32 32v128h-32V96c0-53-43-96-96-96S0 43 0 96v224c0 35.3 28.7 64 64 64h64v96c0 17.7 14.3 32 32 32s32-14.3 32-32v-96h64c35.3 0 64-28.7 64-64V96c0-53-43-96-96-96zM96 320H64V96c0-17.7 14.3-32 32-32s32 14.3 32 32v224c0 17.7-14.3 32-32 32zm320 128h-32V256h32v192zm0-256V96c0-17.7 14.3-32 32-32s32 14.3 32 32v352c0 17.7-14.3 32-32 32s-32-14.3-32-32V192z"/>
            </svg>
        </div>
        
        <div class="footer">AFİYET OLSUN</div>
    </div>

    <script>
        const liste = {
            "30.01.2026": "1.KURU KÖFTE PATATES<br>2.ERİŞTE<br>3.TARHANA ÇORBASI<br>4.SALATA",
            "29.01.2026": "1.ETLİ MEVSİM TÜRLÜSÜ<br>2.MAKARNA (SOSLU)<br>3.MERCİMEK ÇORBASI<br>4.TATLI",
            "28.01.2026": "1.FIRIN PİLİÇ PİRZOLA<br>2.SEB.BULGUR PİLAVI<br>3.DOMATES ÇORBASI<br>4.CACIK"
        };

        function baslat() {
            const simdi = new Date();
            const g = String(simdi.getDate()).padStart(2, '0');
            const a = String(simdi.getMonth() + 1).padStart(2, '0');
            const y = simdi.getFullYear();
            const bugun = g + "." + a + "." + y;

            document.getElementById('date-label').innerText = bugun;
            const alan = document.getElementById('menu-area');

            if (liste[bugun]) {
                alan.innerHTML = liste[bugun];
            } else {
                alan.innerHTML = "Bugün için kayıtlı<br>menü bulunamadı.";
            }
        }
        baslat();
    </script>
</body>
</html>
