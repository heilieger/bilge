<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yemek Menüsü</title>
    <style>
        body { background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
        
        .square-box {
            background: white;
            width: 88vh; height: 88vh;
            border: 15px solid #e30613;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Arka Plan Logosu - Oposity Yüksek */
        .bg-img {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            opacity: 0.45; /* Görünürlüğü buradan artırabilirsin (0.1 - 0.9 arası) */
            z-index: 1;
        }

        .layer { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }
        
        h2 { font-size: 3.5rem; color: #e30613; margin: 10px 0; font-weight: 900; }
        #tarih-alanı { font-size: 1.6rem; color: #444; font-weight: bold; }
        .cizgi { border-top: 3px solid #eee; margin: 15px 0; }

        #menu-icerik {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 2.5rem; 
            font-weight: bold;
            color: #000;
            line-height: 1.4;
            /* Logo üzerinde yazıların okunması için hafif gölge */
            text-shadow: 2px 2px 5px rgba(255,255,255,1);
        }

        .alt-yazi { font-size: 2rem; color: #e30613; font-weight: bold; letter-spacing: 5px; }
    </style>
</head>
<body>

    <div class="square-box">
        <img src="i.png" class="bg-img" alt="Logo">

        <div class="layer">
            <h2>YEMEK MENÜSÜ</h2>
            <div id="tarih-alanı">--.--.----</div>
            <div class="cizgi"></div>
            
            <div id="menu-icerik">Menü Yükleniyor...</div>
            
            <div class="cizgi"></div>
            <div class="alt-yazi">AFİYET OLSUN</div>
        </div>
    </div>
